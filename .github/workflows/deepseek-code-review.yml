# DeepSeek PR review — caller for the shared reusable workflow.
#
# Review logic lives in ModernNomad-98/ci-workflows (.github/workflows/deepseek-review.yml).
# This file declares triggers, gates the @deepseek mention, and passes the API key.
# KEEP THE `uses:` LINE PINNED TO A FULL 40-HEX COMMIT SHA + version comment.
#
# TURN OFF
#   This repo, immediately : gh workflow disable "DeepSeek Code Review" -R ModernNomad-98/Project-Aegis
#   This repo, no-code     : gh variable set DEEPSEEK_REVIEW_ENABLED --body false -R ModernNomad-98/Project-Aegis
#   All repos, mention-only: pwsh ./review.ps1 -Action mention-only   (sets {"auto": false})
#   All repos, fully off   : pwsh ./review.ps1 -Action hold           (sets {"enabled": false})
#   Permanent removal      : delete this file (optionally also the CHAT_TOKEN secret)
#
# REQUIRED: repository secret CHAT_TOKEN = DeepSeek API key (platform.deepseek.com -> API keys)
name: DeepSeek Code Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: DeepSeek review
    # Job-level on purpose: a workflow-level group is entered even by runs whose only job is
    # skipped, so any PR comment (e.g. a bot summary) would cancel an in-progress review.
    # A job that fails its `if` never enters a job-level group.
    concurrency:
      group: deepseek-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    if: |
      vars.DEEPSEEK_REVIEW_ENABLED != 'false' &&
      ((github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@deepseek') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    uses: ModernNomad-98/ci-workflows/.github/workflows/deepseek-review.yml@2354f2e650d9cf803f88cdc223e39ed26ad8cfbc # Sherlock v2: vendored tool, deepseek-flash, thinking max, signed reviews
    secrets:
      CHAT_TOKEN: ${{ secrets.CHAT_TOKEN }}
