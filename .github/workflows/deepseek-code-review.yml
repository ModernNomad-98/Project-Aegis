# DeepSeek PR review — caller for the shared reusable workflow.
#
# Review logic lives in ModernNomad-98/ci-workflows (.github/workflows/deepseek-review.yml).
# This file only declares triggers and passes the DeepSeek API key; keep it identical
# across repositories apart from the OWNER/REPO note below.
#
# TURN OFF
#   This repo, immediately : gh workflow disable "DeepSeek Code Review" -R ModernNomad-98/Project-Aegis
#   This repo, no-code     : gh variable set DEEPSEEK_REVIEW_ENABLED --body false -R ModernNomad-98/Project-Aegis
#   All repos, mention-only: ci-workflows/deepseek-review.yml -> set `auto` default to false
#   All repos, fully off   : ci-workflows/deepseek-review.yml -> set `enabled` default to false
#   Permanent removal      : delete this file (optionally also the CHAT_TOKEN secret)
#
# REQUIRED: repository secret CHAT_TOKEN = DeepSeek API key (platform.deepseek.com -> API keys)
name: DeepSeek Code Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: DeepSeek review
    if: |
      vars.DEEPSEEK_REVIEW_ENABLED != 'false' &&
      ((github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@deepseek') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    uses: ModernNomad-98/ci-workflows/.github/workflows/deepseek-review.yml@main
    secrets:
      CHAT_TOKEN: ${{ secrets.CHAT_TOKEN }}
