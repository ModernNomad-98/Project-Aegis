              "failures": failures,
          }
          PUBLISH_DIR.mkdir(parents=True, exist_ok=True)
          (PUBLISH_DIR / "preflight-only.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          if failures:
