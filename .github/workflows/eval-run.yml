                          f"{expected_results_per_case}"
                      )
              for case_id in completed:
                  entry = entries.get(case_id) or {}
                  for attempt in entry.get("attempts") or []:
                      if not isinstance(attempt, dict):
                          continue
                      name = attempt.get("ledger_name")
                      payload = ledgers.get(name) if isinstance(name, str) else None
                      if not isinstance(payload, dict):
                          # A preflight-only or killed-before-first-charge attempt
                          # has no ledger and no charge, and must not poison a case
                          # a later attempt completed. A recorded charge with no
                          # ledger, and a COMPLETED attempt with no ledger, are
                          # still refused.
                          recorded = integer(attempt.get("spent_cents"))
                          if attempt.get("status") == "COMPLETED" or (
                              recorded is not None and recorded > 0
                          ):
                              verification_failures.append(
                                  f"{case_id}: a completed attempt has no ledger"
                              )
                          continue
                      if integer(payload.get("unreconciled_count")) != 0:
                          verification_failures.append(
                              f"{case_id}: a completed attempt has unreconciled "
                              "cost entries"
                          )
          if any(record.get("raw_transcript_included") is not False for record in records):
              verification_failures.append(
                  "a result record says a raw transcript was included"
              )
          if status == "COMPLETED":
              # A manifest that recorded a failure cannot be published COMPLETED,
              # even when the recomputed status looks complete.
              verification_failures.extend(state.get("failures") or [])
              totals = state.get("totals")
              totals = totals if isinstance(totals, dict) else {}
              if integer(totals.get("spent_cents")) != spent_total:
                  verification_failures.append(
                      "the manifest spend total does not match the recomputed "
                      "ledger total"
                  )
              if integer(totals.get("cases_completed")) != len(completed):
                  verification_failures.append(
                      "the manifest completed-case count does not match the "
                      "restored cases"
                  )
          if verification_failures:
              # unrun_is_never_pass, extended: a record that failed verification
              # is never published as COMPLETED or PASS. The status written to
              # the artifact and the step's exit code agree.
              status = "VERIFICATION_FAILED"
              verdict = "UNRUN"
          # A record is verified only when it is COMPLETED and internally
          # consistent: HALTED, INCOMPLETE and REFUSED are never "passed".
          verification_passed = status == "COMPLETED" and not verification_failures

          summary = {
              "schema_version": "apr161-eval-run-summary/1.0.0",
              "generated_at": dt.datetime.now(dt.timezone.utc)
              .isoformat()
              .replace("+00:00", "Z"),
              "workflow": {
                  "name": "eval-run",
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "event": os.environ.get("GITHUB_EVENT_NAME"),
                  "ref": os.environ.get("GITHUB_REF"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "environment": "eval-run",
              },
              "owner_gate": {
                  "gate_id": plan.get("gate_id"),
                  "template_revision": plan.get("template_gate_revision"),
                  "staged_revision": plan.get("staged_gate_revision"),
                  "template_sha256": plan.get("template_gate_sha256"),
                  "staged_sha256": plan.get("staged_gate_sha256"),
                  "staged_record_digest": plan.get("staged_gate_digest"),
                  "dataset_path": plan.get("dataset_path"),
                  "dataset_sha256": plan.get("dataset_sha256"),
                  "case_count": plan.get("case_count"),
              },
              "run": {
                  "status": status,
                  "verdict": verdict,
                  "result_parse_ok": bool(records),
                  "halted": halt_view is not None,
                  "halt": halt_view,
                  "halt_reason_code": (
                      halt_payload.get("reason_code")
                      if isinstance(halt_payload, dict)
                      else None
                  ),
                  "config_loaded": bool(config),
                  "failures": state.get("failures") or [],
              },
              "accounting": versioned_accounting_fields(
                  ledger_spend_cents=spent_total - smoke_spend,
                  smoke_spend_records=smoke_records,
                  outstanding_reservations_cents=state.get("incoming_outstanding_reservations_cents", 0),
                  ceiling_cents=effective_ceiling,
              ),
              "cost": {
                  "configured_ceiling_cents": configured,
                  "owner_limits": owner_limits,
                  "ceiling_cents": effective_ceiling,
                  "spent_cents": spent_total,
                  "remaining_cents": max(0, effective_ceiling - spent_total),
                  "ledger_spend_cents": spent_total - smoke_spend,
                  "smoke_spend_cents": smoke_spend,
                  "unreconciled_count": unreconciled_total,
                  "reconciled_total": reconciled_total,
                  "reconciliation": reconciled_ledgers,
                  "call_count": ledger_call_count,
                  "planned_calls": plan.get("planned_calls"),
                  "dispatched_calls": sum(
                      attempt.get("dispatched_calls")
                      for case_id in case_ids
                      for attempt in (entries.get(case_id) or {}).get("attempts") or []
                      if isinstance(attempt, dict)
                      and type(attempt.get("dispatched_calls")) is int
                  ),
              },
              "counts": {
                  "results": len(details),
                  "results_by_state": counts(all_states),
                  "citable_results": citable,
                  "unrun_results": len(unrun_items),
                  "cases_completed": len(completed),
                  "cases_missing": len(missing_cases),
                  "ledgers": len(ledgers),
              },
              "resume": {
                  "restored_from": state.get("restored_from"),
                  "resume_refusal": state.get("resume_refusal"),
                  "prior_spend_cents": (state.get("restored_from") or {}).get(
                      "prior_spend_cents"
                  ),
                  "prior_smoke_spend_cents": (state.get("restored_from") or {}).get(
                      "prior_smoke_spend_cents"
                  ),
                  "smoke_spend_cents": smoke_spend,
                  "cases_skipped_as_complete": (state.get("last_dispatch") or {}).get(
                      "skipped_as_complete", []
                  ),
                  "cases_ran_in_this_dispatch": (state.get("last_dispatch") or {}).get(
                      "ran_in_this_dispatch", []
                  ),
                  "attempts_total": sum(item["attempts"] for item in per_case),
              },
              "skills": skill_rows,
              "cases": case_rows_out,
              "case_status": per_case,
              "missing_cases": missing_cases,
              "unrun": {
                  "count": len(unrun_items),
                  "case_ids": sorted({item["case_id"] for item in unrun_items}),
                  "skills": sorted({item["skill"] for item in unrun_items}),
                  "reason_codes": sorted(
                      {item["reason_code"] for item in unrun_items
                       if item.get("reason_code")}
                  ),
              },
              "evidence": {
                  "case_bundles": evidence_bundles,
                  "raw_transcripts_included": False,
              },
              "policy": {
                  "unrun_is_never_pass": True,
                  "deterministic_graders_primary": True,
                  "raw_prompts_included": False,
                  "raw_responses_included": False,
                  "raw_transcripts_included": False,
                  "one_case_per_invocation": True,
                  "completed_case_is_never_redispatched": True,
                  "cross_dispatch_spend_is_cumulative": True,
              },
              "verification": {
                  "passed": verification_passed,
                  "status": status,
                  "manifest_failures": state.get("failures") or [],
                  "failures": verification_failures,
              },
          }

          text = json.dumps(summary, indent=2, sort_keys=True) + "\n"
          EVIDENCE_ROOT.mkdir(parents=True, exist_ok=True)
          (EVIDENCE_ROOT / "structured-summary.json").write_text(text, encoding="utf-8")
          PUBLISH_DIR.mkdir(parents=True, exist_ok=True)
          (PUBLISH_DIR / "structured-summary.json").write_text(text, encoding="utf-8")
          ledger_out = PUBLISH_DIR / "cost-ledger.json"
          ledgers_out = []
          for name, payload in sorted(ledgers.items()):
              ledgers_out.append({
                  "ledger": name,
                  "spent_cents": payload.get("spent_cents"),
                  "ceiling_cents": payload.get("ceiling_cents"),
                  "unreconciled_count": payload.get("unreconciled_count"),
              })
          ledger_out.write_text(
              json.dumps(
                  {"schema": "ber-pilot-a-ledgers/1.1.0", "ledgers": ledgers_out,
                   "spent_cents": spent_total,
                   "ledger_spend_cents": spent_total - smoke_spend,
                   "smoke_spend_cents": smoke_spend,
                   "ceiling_cents": effective_ceiling},
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "structured_summary": str(EVIDENCE_ROOT / "structured-summary.json"),
              "publish_dir": str(PUBLISH_DIR),
              "status": status,
              "verdict": verdict,
              "results_by_state": counts(all_states),
              "spent_cents": spent_total,
              "unreconciled_count": unreconciled_total,
              "reconciled_total": reconciled_total,
              "unrun_results": len(unrun_items),
              "cases_completed": len(completed),
              "cases_missing": len(missing_cases),
              "verification": {
                  "passed": verification_passed,
                  "failures": verification_failures,
              },
          }, indent=2, sort_keys=True))
          if not verification_passed or verification_failures:
              raise SystemExit(1)
          PY
      - name: Upload structured summary and cost ledger (no raw evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-run-structured-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish/
          retention-days: 14
          if-no-files-found: error
