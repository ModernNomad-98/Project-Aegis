      - name: Live preflight (staged gate; checkout must equal the gate revision)
        env:
          # The dispatch value is mapped through the environment, never
          # interpolated into the script: a shell metacharacter in an input
          # cannot become code, and an extra '$' cannot mangle the path.
          CASES_PATH: ${{ inputs.cases_path }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -P -m tools.behavioral_eval_runner live-preflight \
            --config "$RUNNER_TEMP/live-config.json" \
            --gate "$RUNNER_TEMP/live-gate.json" \
            --cases "$CASES_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-revision "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/ber-preflight.json"
          python -P - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          RUNNER_TEMP = Path(os.environ["RUNNER_TEMP"]).resolve()
          report = json.loads((RUNNER_TEMP / "ber-preflight.json").read_text(encoding="utf-8"))
          plan = json.loads((RUNNER_TEMP / "ber-plan.json").read_text(encoding="utf-8"))
          dispatch_sha = os.environ["GITHUB_SHA"].strip()
          gate = report.get("gate") or {}
          dataset = report.get("dataset") or {}
          blockers = report.get("blockers")
          failures = []
          # Recompute the staged gate's hash from the file the preflight read
          # rather than echoing the plan, and require the package's own record
          # digest to be the one the plan staged: a swapped file fails here.
          try:
              staged_bytes = (RUNNER_TEMP / "live-gate.json").read_bytes()
          except OSError:
              staged_bytes = b""
          staged_sha256 = hashlib.sha256(staged_bytes).hexdigest()
          if staged_sha256 != plan["staged_gate_sha256"]:
              failures.append("the staged gate file is not the bytes the plan recorded")
          if gate.get("digest") != plan["staged_gate_digest"]:
              failures.append("the preflight gate digest is not the staged record digest")
          if report.get("status") not in {"READY", "READY_NEEDS_KEYS"}:
              failures.append(f"preflight status is {report.get('status')!r}")
          if blockers:
              failures.append(f"preflight reported {len(blockers)} blocker(s)")
          if report.get("checkout_revision") != dispatch_sha:
              failures.append("the checkout revision is not the dispatched commit")
          if gate.get("dataset_revision") != dispatch_sha:
              failures.append("the staged gate revision is not the dispatched commit")
          if not (
              report.get("checkout_revision")
              == gate.get("dataset_revision")
              == dispatch_sha
          ):
              failures.append("checkout revision != gate revision")
          if dataset.get("digest") != plan["dataset_sha256"]:
              failures.append("the preflight dataset digest is not the frozen digest")
          if dataset.get("case_count") != plan["case_count"]:
              failures.append("the preflight case count is not the frozen count")
          if report.get("network_calls") != 0:
              failures.append("the preflight reported a network call")
          if report.get("effective_ceiling_cents") != plan["spend_ceiling_cents"]:
              failures.append("the preflight effective ceiling is not the plan's")
          # The cases path the step actually handed the preflight must be the
          # dispatched repository-relative cases_path and must resolve to the
          # gate template dataset.path. A mangled or expanded-to-empty argument
          # fails here even if the package somehow accepted it.
          dispatched_cases = os.path.realpath(
              os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["CASES_PATH"])
          )
          # The report echoes the root exactly as the step passed it, so it is
          # resolved against the workspace here rather than against this
          # program's current directory.
          preflighted_cases = os.path.realpath(
              os.path.join(
                  os.environ["GITHUB_WORKSPACE"], str(dataset.get("root") or "")
              )
          )
          if preflighted_cases != dispatched_cases:
              failures.append("the preflight cases root is not the dispatched cases_path")
          expected_cases = os.path.realpath(
              os.path.join(os.environ["GITHUB_WORKSPACE"], str(plan["dataset_path"]))
          )
          if dispatched_cases != expected_cases:
              failures.append("cases_path is not the gate template dataset.path")
          if report.get("planned_calls") != plan["planned_calls"]:
              failures.append("preflight planned_calls differs from the plan")
          proof = {
              "status": report.get("status"),
              "cases_path_input": os.environ["CASES_PATH"],
              "cases_root_preflighted": dataset.get("root"),
              "cases_root_resolved": dispatched_cases,
              "dataset_path": plan["dataset_path"],
              "checkout_revision": report.get("checkout_revision"),
              "gate_dataset_revision": gate.get("dataset_revision"),
              "checkout_equals_gate_revision": (
                  report.get("checkout_revision") == gate.get("dataset_revision")
              ),
              "checkout_equals_dispatch_sha": report.get("checkout_revision") == dispatch_sha,
              "staged_gate_path": plan["staged_gate_path"],
              "staged_gate_sha256": staged_sha256,
              "staged_gate_record_digest": gate.get("digest"),
              "template_gate_revision_placeholder": plan["template_gate_revision"],
              "dataset_sha256": dataset.get("digest"),
              "case_count": dataset.get("case_count"),
              "planned_calls": report.get("planned_calls"),
              "effective_ceiling_cents": report.get("effective_ceiling_cents"),
              "blockers": blockers,
              "network_calls": report.get("network_calls"),
              "failures": failures,
          }
          print(json.dumps(proof, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(1)
          PY

      - name: Require a passing single-case live smoke at this exact head
        # The owner-directed required gate before any full Pilot A dispatch:
        # eval-smoke spends exactly one subject call and one judge call, records
        # the JUDGE terminal finish reason in a PASS proof artifact, and the full
        # dispatch refuses here unless a PASSING eval-smoke workflow_dispatch run
        # exists at the SAME exact head SHA and that proof verifies against this
        # dispatch's frozen gate/dataset plan. This step makes no provider call
        # and maps no key.
        if: ${{ inputs.preflight_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -P - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from tools.behavioral_eval_runner.live.config import (  # noqa: E402
              SMOKE_CEILING_CENTS,
          )

          RUNNER_TEMP = Path(os.environ["RUNNER_TEMP"]).resolve()
          plan = json.loads((RUNNER_TEMP / "ber-plan.json").read_text(encoding="utf-8"))
          dispatch_sha = os.environ["GITHUB_SHA"].strip()
          repository = os.environ["REPOSITORY"]

          def fail(message):
              print("REFUSED: " + message, flush=True)
              raise SystemExit(1)

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True)

          listing = gh(
              "api", "--paginate", "--slurp",
              "repos/" + repository + "/actions/workflows/eval-smoke.yml/runs"
              + "?head_sha=" + dispatch_sha + "&per_page=100",
          )
          if listing.returncode != 0:
              fail("the eval-smoke run listing failed: " + listing.stderr.strip()[:400])
          try:
              pages = json.loads(listing.stdout or "[]")
          except ValueError:
              fail("the eval-smoke run listing was not JSON")
          if not isinstance(pages, list):
              fail("the eval-smoke run listing was not a page list")
          runs = []
          for page in pages:
              if isinstance(page, dict):
                  runs.extend(page.get("workflow_runs") or [])
          candidates = [
              run for run in runs
              if isinstance(run, dict)
              and run.get("head_sha") == dispatch_sha
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("path") == ".github/workflows/eval-smoke.yml"
          ]
          if not candidates:
              fail(
                  "no successful eval-smoke workflow_dispatch run exists at the "
                  "dispatched head; run eval-smoke on this exact head first"
              )
          candidates.sort(key=lambda run: run.get("run_started_at") or "", reverse=True)
          proof = None
          selected = None
          proof_path = None
          for run in candidates:
              artifacts = gh(
                  "api", "repos/" + repository + "/actions/runs/"
                  + str(run["id"]) + "/artifacts?per_page=100",
              )
              if artifacts.returncode != 0:
                  continue
              try:
                  items = json.loads(artifacts.stdout or "{}").get("artifacts") or []
              except ValueError:
                  continue
              if not any(
                  item.get("name") == "ber-live-smoke-proof"
                  and item.get("expired") is False
                  for item in items
                  if isinstance(item, dict)
              ):
                  continue
              target = RUNNER_TEMP / "ber-smoke-gate" / str(run["id"])
              download = gh(
                  "run", "download", str(run["id"]),
                  "--repo", repository,
                  "--name", "ber-live-smoke-proof",
                  "--dir", str(target),
              )
              if download.returncode != 0:
                  continue
              candidate_path = target / "smoke-proof.json"
              if not candidate_path.is_file():
                  continue
              try:
                  payload = json.loads(candidate_path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              proof = payload
              selected = run
              proof_path = candidate_path
              break
          if proof is None or selected is None or proof_path is None:
              fail(
                  "no readable ber-live-smoke-proof artifact was found at the "
                  "dispatched head; the full Pilot A dispatch requires a passing "
                  "single-case live smoke at this exact head"
              )

          complete_stop_reasons = {"end_turn", "stop_sequence", "completed"}
          failures = []

          def require(condition, message):
              if not condition:
                  failures.append(message)

          require(proof.get("schema") == "ber-live-smoke-proof/1.0.0", "proof schema")
          require(proof.get("status") == "PASS", "proof status is not PASS")
          require(proof.get("required_gate_before_full_pilot_a") is True, "proof is not marked as the required gate")
          require(proof.get("head_sha") == dispatch_sha, "proof head is not the dispatched head")
          require(proof.get("workflow") == "eval-smoke", "proof workflow is not eval-smoke")
          require(str(proof.get("workflow_run_id")) == str(selected.get("id")), "proof run id is not the selected run")
          require(proof.get("gate_id") == plan.get("gate_id"), "proof gate id is not the dispatch gate")
          require(proof.get("gate_template_path") == plan.get("template_gate_path"), "proof gate template is not the dispatch gate template")
          require(proof.get("dataset_path") == plan.get("dataset_path"), "proof dataset path is not the dispatch dataset")
          require(proof.get("dataset_sha256") == plan.get("dataset_sha256"), "proof dataset digest is not the frozen dataset")
          require(proof.get("case_count") == plan.get("case_count"), "proof case count is not the frozen count")
          require(proof.get("planned_calls") == 2, "proof planned calls is not 2")
          require(proof.get("dispatched_calls") == 2, "proof dispatched calls is not 2")
          require(proof.get("subject_calls") == 1, "proof did not make exactly one subject call")
          require(proof.get("judge_calls") == 1, "proof did not make exactly one judge call")
          require(proof.get("judge_finish_reason") in complete_stop_reasons, "proof lacks a complete JUDGE finish reason")
          require(proof.get("subject_stop_reason") in complete_stop_reasons, "proof lacks a complete subject finish reason")
          require(proof.get("result_state") in {"PASS", "FAIL"}, "proof has no rule state")
          require(proof.get("citability") == "REAL_HOST", "proof is not real-host citable evidence")
          spent = proof.get("spent_cents")
          ceiling = proof.get("ceiling_cents")
          require(type(spent) is int and spent >= 0, "proof spend is not a non-negative int")
          require(
              type(ceiling) is int and 0 < ceiling <= SMOKE_CEILING_CENTS,
              "proof ceiling is outside the 200-cent ($2.00) smoke cap",
          )
          require(type(spent) is int and type(ceiling) is int and spent <= ceiling, "proof spend exceeds its ceiling")
          require(proof.get("max_output_tokens") == plan.get("max_output_tokens"), "proof output budget is not this dispatch config")
          require(type(proof.get("max_output_tokens")) is int and proof["max_output_tokens"] >= plan.get("live_setting_floor_tokens", 0), "proof output budget is below the live floor")
          require(not proof.get("failures"), "proof records verification failures")
          require(selected.get("head_sha") == dispatch_sha, "selected smoke run head is not the dispatched head")
          require(selected.get("conclusion") == "success", "selected smoke run did not succeed")
          if failures:
              print(json.dumps({"failures": failures, "proof": proof}, indent=2, sort_keys=True))
              fail("the single-case live smoke proof does not satisfy the required gate")

          plan["smoke_gate"] = {
              "schema": "ber-live-smoke-gate/1.0.0",
              "head_sha": dispatch_sha,
              "smoke_workflow": ".github/workflows/eval-smoke.yml",
              "smoke_run_id": selected.get("id"),
              "smoke_run_attempt": selected.get("run_attempt"),
              "smoke_artifact_name": "ber-live-smoke-proof",
              "smoke_proof_sha256": hashlib.sha256(proof_path.read_bytes()).hexdigest(),
              "judge_finish_reason": proof.get("judge_finish_reason"),
              "subject_stop_reason": proof.get("subject_stop_reason"),
              "spent_cents": spent,
              "ceiling_cents": ceiling,
              "max_output_tokens": proof.get("max_output_tokens"),
              "checked_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          (RUNNER_TEMP / "ber-plan.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(plan["smoke_gate"], indent=2, sort_keys=True))
          print("single-case live smoke gate SATISFIED at " + dispatch_sha)
          PY

      - name: Restore every prior dispatch's resume state for this dataset
        id: restore
        # Fail closed: this step refuses rather than resuming blind whenever a
        # prior run's artifact, manifest, ledger or result cannot be read, the
        # listing is incomplete, the ledger charge is not a non-negative
        # integer, or the dispatch is a re-run. The run step below only executes
        # when this step succeeded, so a refusal can never re-dispatch completed
        # cases (and never re-spends their budget). Only the exact literal
        # boolean true selects preflight-only mode; any other value, or no
        # value, runs the live path with every live gate in force.
        if: ${{ inputs.preflight_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -P - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          RUNNER_TEMP = Path(os.environ["RUNNER_TEMP"]).resolve()
          WORKSPACE = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          MANIFEST_DIR = RUNNER_TEMP / "ber-manifest"
          CASES_DIR = MANIFEST_DIR / "cases"
          LEDGER_DIR = MANIFEST_DIR / "ledgers"
          RESTORE_DIR = RUNNER_TEMP / "ber-restore"
          for directory in (MANIFEST_DIR, CASES_DIR, LEDGER_DIR, RESTORE_DIR):
              directory.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(WORKSPACE))
          from tools.behavioral_eval_runner.live.allowance_history import (  # noqa: E402
              collect_latest_allowance_state,
              collect_smoke_proof_spends,
          )
          from tools.behavioral_eval_runner.live.cumulative import (  # noqa: E402
              add_smoke_spend,
              merge_smoke_gate_spend,
              normalize_smoke_run_id,
              restore_smoke_spend,
              smoke_spend_total,
              validate_smoke_spend,
          )
          from tools.behavioral_eval_runner.live.ledger_reconciliation import (  # noqa: E402
              LedgerReconciliationRefusedError,
              load_records,
              reconcile_ledger,
          )
          plan = json.loads((RUNNER_TEMP / "ber-plan.json").read_text(encoding="utf-8"))
          repository = os.environ.get("REPOSITORY", "")
          current_run = str(os.environ.get("GITHUB_RUN_ID", "")).strip()
          run_attempt = str(os.environ.get("GITHUB_RUN_ATTEMPT", "1")).strip() or "1"
          ARTIFACT_NAME = "ber-resume-manifest"


          def refuse(message):
              # Fail closed: an unreadable or unverifiable prior charge must stop the
              # dispatch rather than silently shrink the spend baseline.
              print("RESUME REFUSED: " + message, flush=True)
              raise SystemExit(1)


          def gh(*args):
              try:
                  return subprocess.run(
                      ["gh", *args],
                      capture_output=True,
                      text=True,
                      timeout=300,
                  )
              except (OSError, subprocess.SubprocessError):
                  return None


          def utc_now():
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def integer(value):
              return value if type(value) is int else None


          def ledger_spend(path):
              # A ledger that cannot be read or does not carry a non-negative integer
              # charge is a refusal, never zero: dropping it would understate spend.
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  refuse("ledger " + path.name + " is unreadable")
              if not isinstance(payload, dict):
                  refuse("ledger " + path.name + " is not a JSON object")
              spent = payload.get("spent_cents")
              if type(spent) is not int or spent < 0:
                  refuse("ledger " + path.name + " has no non-negative integer spent_cents")
              return spent


          def attempt_of(name):
              # "<case>-attempt<N>.json" and "<run-id>-<case>-attempt<N>.json"
              stem = name[:-5] if name.endswith(".json") else name
              marker = stem.rfind("-attempt")
              if marker < 0:
                  return None, None
              tail = stem[marker + len("-attempt"):]
              if not tail.isdigit():
                  return None, None
              # Match the owner against the plan's case ids so a ledger copied
              # under a run-scoped name ("<run-id>-<case>-attempt<N>.json") is
              # attributed to its case instead of becoming an orphan charge.
              owner = stem[:marker]
              for candidate in plan["case_ids"]:
                  if owner == candidate or owner.endswith("-" + candidate):
                      return candidate, int(tail)
              return None, None


          if not current_run.isdigit():
              refuse("GITHUB_RUN_ID is missing, so prior state cannot be identified")
          if run_attempt != "1":
              # A re-run of the same run id would reuse the same run-scoped resume
              # artifact name, so its previous attempt cannot be read back reliably.
              # Instead of starting from a fresh baseline and losing that attempt's
              # spend (or double counting it), this dispatch refuses; a fresh dispatch
              # resumes the uploaded manifest of every completed run.
              refuse(
                  "run " + current_run + " attempt " + run_attempt + " is a re-run; "
                  "re-runs are not resumed because the resume artifact is run-scoped. "
                  "Dispatch a fresh run instead."
              )

          state = {
              "schema": "ber-resume-manifest/1.2.0",
              "plan": plan,
              "created_at": utc_now(),
              "restored_from": None,
              "resume_refusal": None,
              "cases": {
                  case_id: {"case_id": case_id, "status": "PENDING", "attempts": []}
                  for case_id in plan["case_ids"]
              },
          }
          merged = {case_id: {} for case_id in plan["case_ids"]}
          seen_ledgers = {}
          completed = {}
          source_runs = []
          skipped = []
          without_artifact = []
          prior_smoke_spends = {}
          prior_smoke_manifests = []
          legacy_smoke_manifests = []
          # Full listing, paginated: the previous fixed 30-run window silently forgot
          # the spend of anything older. A listing this step cannot read completely is
          # a refusal, because an unseen run may have spent.
          listing = gh(
              "api", "--paginate", "--slurp",
              "repos/" + repository + "/actions/workflows/eval-run.yml/runs?per_page=100",
          )
          if listing is None:
              refuse("the prior-run listing could not be executed")
          if listing.returncode != 0:
              print((listing.stderr or "").strip(), flush=True)
              refuse("the prior-run listing failed with exit code " + str(listing.returncode))
          try:
              listing_pages = json.loads(listing.stdout or "[]")
          except ValueError:
              refuse("the prior-run listing was not JSON")
          if not isinstance(listing_pages, list):
              refuse("the prior-run listing was not a list of pages")
          declared_total = None
          prior_runs = []
          for page in listing_pages:
              if not isinstance(page, dict):
                  refuse("a prior-run listing page was not a JSON object")
              if declared_total is None:
                  declared_total = page.get("total_count")
              page_runs = page.get("workflow_runs")
              if not isinstance(page_runs, list):
                  refuse("a prior-run listing page has no workflow_runs list")
              prior_runs.extend(page_runs)
          if type(declared_total) is not int or declared_total < 0:
              refuse("the prior-run listing did not report an integer total_count")
          if len(prior_runs) < declared_total:
              refuse(
                  "the prior-run listing is incomplete ("
                  + str(len(prior_runs))
                  + " of "
                  + str(declared_total)
                  + " runs); refusing to resume against a partial spend history"
              )
          ordered_runs = []
          seen_run_ids = set()
          for run in prior_runs:
              if not isinstance(run, dict):
                  refuse("a prior-run listing entry was not a JSON object")
              run_id = run.get("id")
              if type(run_id) is not int:
                  refuse("a prior-run listing entry has no integer run id")
              if str(run_id) == current_run:
                  continue
              if run_id in seen_run_ids:
                  continue
              seen_run_ids.add(run_id)
              ordered_runs.append(str(run_id))

          # Process oldest to newest so a newer completion/attempt record
          # overwrites an older one; the listing itself is newest-first.
          for run_id in reversed(ordered_runs):
              target = RESTORE_DIR / run_id
              shutil.rmtree(target, ignore_errors=True)
              # Distinguish "this run published no resume artifact" from "the artifact
              # exists but could not be downloaded": only the former is a legitimate
              # empty resume, and even then the run is recorded, never silently dropped.
              artifacts = gh(
                  "api", "--paginate", "--slurp",
                  "repos/" + repository + "/actions/runs/" + run_id + "/artifacts?per_page=100",
              )
              if artifacts is None:
                  refuse("the artifact listing for run " + run_id + " could not be executed")
              if artifacts.returncode != 0:
                  print((artifacts.stderr or "").strip(), flush=True)
                  refuse("the artifact listing for run " + run_id + " failed")
              try:
                  artifact_pages = json.loads(artifacts.stdout or "[]")
              except ValueError:
                  refuse("the artifact listing for run " + run_id + " was not JSON")
              if not isinstance(artifact_pages, list):
                  refuse("the artifact listing for run " + run_id + " was not a page list")
              published = False
              for page in artifact_pages:
                  if not isinstance(page, dict):
                      refuse("an artifact listing page for run " + run_id + " was not an object")
                  page_artifacts = page.get("artifacts")
                  if not isinstance(page_artifacts, list):
                      refuse("an artifact listing page for run " + run_id + " has no artifacts list")
                  for artifact in page_artifacts:
                      if isinstance(artifact, dict) and artifact.get("name") == ARTIFACT_NAME:
                          published = True
              if not published:
                  # "Published nothing" is legitimate only when the case step never
                  # executed (preflight-only, or a refusal before it). A run whose
                  # case step executed must have published a manifest; if it did
                  # not, its spend cannot be proven and the dispatch is refused.
                  jobs = gh(
                      "api", "--paginate", "--slurp",
                      "repos/" + repository + "/actions/runs/" + run_id
                      + "/jobs?per_page=100",
                  )
                  if jobs is None:
                      refuse("the job listing for run " + run_id + " could not be executed")
                  if jobs.returncode != 0:
                      print((jobs.stderr or "").strip(), flush=True)
                      refuse("the job listing for run " + run_id + " failed")
                  try:
                      job_pages = json.loads(jobs.stdout or "[]")
                  except ValueError:
                      refuse("the job listing for run " + run_id + " was not JSON")
                  if not isinstance(job_pages, list):
                      refuse("the job listing for run " + run_id + " was not a page list")
                  executed = False
                  for page in job_pages:
                      if not isinstance(page, dict):
                          refuse("a job listing page for run " + run_id + " was not an object")
                      page_jobs = page.get("jobs")
                      if not isinstance(page_jobs, list):
                          refuse("a job listing page for run " + run_id + " has no jobs list")
                      for job in page_jobs:
                          if not isinstance(job, dict):
                              continue
                          for job_step in job.get("steps") or []:
                              if not isinstance(job_step, dict):
                                  continue
                              step_name = job_step.get("name")
                              if (
                                  isinstance(step_name, str)
                                  and step_name.startswith("Run the remaining cases")
                                  and job_step.get("conclusion") != "skipped"
                              ):
                                  executed = True
                  if executed:
                      refuse(
                          "run " + run_id + " executed the case step but published no "
                          "resume artifact; its spend cannot be proven"
                      )
                  without_artifact.append(run_id)
                  continue
              download = gh(
                  "run", "download", run_id,
                  "--repo", repository,
                  "--name", ARTIFACT_NAME,
                  "--dir", str(target),
              )
              if download is None:
                  refuse("the resume artifact download for run " + run_id + " could not be executed")
              if download.returncode != 0:
                  print((download.stderr or "").strip(), flush=True)
                  refuse(
                      "run " + run_id + " published a resume artifact but its download "
                      "failed with exit code " + str(download.returncode)
                      + "; refusing to forget that run's spend"
                  )
              manifest_path = target / "manifest.json"
              if not manifest_path.is_file():
                  refuse("run " + run_id + " published a resume artifact with no manifest.json")
              try:
                  prior = json.loads(manifest_path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  # The ledgers are the spend record, but without a manifest this step
                  # cannot prove the artifact belongs to this frozen dataset; refusing
                  # is safer than importing an unidentified charge history.
                  refuse("run " + run_id + " has an unreadable manifest; refusing to resume")
              if not isinstance(prior, dict):
                  refuse("run " + run_id + " manifest is not a JSON object")
              prior_plan = prior.get("plan")
              if not isinstance(prior_plan, dict):
                  refuse("run " + run_id + " manifest has no plan object")
              same_config = prior_plan.get("config_sha256") == plan.get("config_sha256")
              same_template = (
                  prior_plan.get("template_gate_sha256")
                  == plan["template_gate_sha256"]
              )
              if prior_plan.get("dataset_sha256") != plan["dataset_sha256"]:
                  # A different frozen dataset is a different budget: nothing
                  # here can be attributed to this dataset's cases.
                  skipped.append(
                      {"run_id": run_id, "reason": "different frozen dataset"}
                  )
                  continue
              source_runs.append(run_id)
              prior_smoke = prior.get("smoke_spend")
              if prior_smoke is None:
                  # F-A-4: an older resume manifest without smoke accounting
                  # must not be silently counted as zero smoke spend.
                  legacy_smoke_manifests.append(run_id)
              try:
                  prior_smoke_records = validate_smoke_spend(prior_smoke)
              except ValueError as exc:
                  refuse("run " + run_id + " has invalid smoke spend records: " + str(exc))
              prior_smoke_manifests.append(prior_smoke_records)
              # 1. Every ledger in the artifact is copied under a run-scoped name: two
              #    dispatches may both hold "<case>-attempt1.json", and each charge must
              #    survive with its own file. A nested copy of an earlier ledger (same
              #    un-prefixed name and bytes) is copied exactly once, so no charge is
              #    counted twice and none is lost.
              by_original = {}
              ledger_source = target / "ledgers"
              if ledger_source.is_dir():
                  for ledger in sorted(ledger_source.glob("*.json")):
                      if not ledger.is_file():
                          continue
                      spent = ledger_spend(ledger)
                      try:
                          content = hashlib.sha256(ledger.read_bytes()).hexdigest()
                      except OSError:
                          refuse("ledger " + ledger.name + " from run " + run_id + " is unreadable")
                      identity = re.sub(r"^(?:[0-9]+-)+", "", ledger.name)
                      key = (identity, content)
                      unique = seen_ledgers.get(key)
                      if unique is None:
                          unique = run_id + "-" + ledger.name
                          shutil.copyfile(ledger, LEDGER_DIR / unique)
                          copied_spent = ledger_spend(LEDGER_DIR / unique)
                          if copied_spent != spent:
                              refuse("the copied ledger " + unique + " does not match its source")
                          seen_ledgers[key] = unique
                      by_original[ledger.name] = {
                          "ledger_name": unique,
                          "spent_cents": spent,
                      }
                      case_id, attempt = attempt_of(ledger.name)
                      if case_id in merged and attempt is not None:
                          known = merged[case_id].get(attempt) or {}
                          if not known.get("ledger_name"):
                              merged[case_id].setdefault(attempt, {})
                              merged[case_id][attempt].update({
                                  "attempt": attempt,
                                  "status": "PRIOR_LEDGER_ONLY",
                                  "spent_cents": spent,
                                  "ledger_name": unique,
                                  "source_run_id": run_id,
                              })
              # 2. The manifest's attempt records add status, hashes and any spend the
              #    artifact's ledger did not carry. A recorded charge never overrides an
              #    observed ledger charge, and a recorded charge with no ledger is a
              #    refusal rather than a number this step would have to trust.
              prior_cases = prior.get("cases")
              if not isinstance(prior_cases, dict):
                  refuse("run " + run_id + " manifest has no cases object")
              for case_id, entry in prior_cases.items():
                  if case_id not in merged or not isinstance(entry, dict):
                      continue
                  for record in entry.get("attempts") or []:
                      if not isinstance(record, dict):
                          continue
                      attempt = integer(record.get("attempt"))
                      if attempt is None:
                          continue
                      original = record.get("ledger_name")
                      found = by_original.get(original) if isinstance(original, str) else None
                      observed = found.get("spent_cents") if found else None
                      recorded = integer(record.get("spent_cents"))
                      if recorded is not None and recorded < 0:
                          refuse(
                              "run " + run_id + " case " + str(case_id) + " attempt "
                              + str(attempt) + " records a negative spend"
                          )
                      if observed is None and recorded is not None and recorded > 0:
                          refuse(
                              "run " + run_id + " case " + str(case_id) + " attempt "
                              + str(attempt) + " records " + str(recorded)
                              + "c but its ledger is missing from the artifact"
                          )
                      merged[case_id][attempt] = {
                          "attempt": attempt,
                          "status": record.get("status"),
                          "spent_cents": observed if observed is not None else recorded,
                          "ledger_name": found.get("ledger_name") if found else None,
                          "source_run_id": run_id,
                          "started_at": record.get("started_at"),
                          "finished_at": record.get("finished_at"),
                          "dispatched_calls": integer(record.get("dispatched_calls")),
                          "result_sha256": record.get("result_sha256"),
                          # The per-case chunk gate is part of the run record:
                          # a resumed manifest keeps the digest each live-run
                          # was dispatched with, not only the newest one.
                          "chunk_dataset_sha256": record.get("chunk_dataset_sha256"),
                          "chunk_gate_sha256": record.get("chunk_gate_sha256"),
                          "chunk_gate_digest": record.get("chunk_gate_digest"),
                          "returncode": integer(record.get("returncode")),
                          "halt_view": record.get("halt_view"),
                          "halt_reason_code": record.get("halt_reason_code"),
                          "error_present": record.get("error_present"),
                          "preflight_status": record.get("preflight_status"),
                      }
                  if entry.get("status") != "COMPLETED":
                      continue
                  if not (same_config and same_template):
                      skipped.append(
                          {"run_id": run_id, "case_id": case_id,
                           "reason": "different gate template or built config; "
                                     "completion not reused"}
                      )
                      continue
                  result_path = target / "cases" / (case_id + ".json")
                  if not result_path.is_file():
                      refuse(
                          "run " + run_id + " marks " + str(case_id)
                          + " COMPLETED but its result file is missing"
                      )
                  payload = result_path.read_bytes()
                  digest = hashlib.sha256(payload).hexdigest()
                  declared = entry.get("result_sha256")
                  if not isinstance(declared, str) or declared != digest:
                      refuse(
                          "run " + run_id + " marks " + str(case_id)
                          + " COMPLETED but its result hash is missing or does not match"
                      )
                  # A COMPLETED entry is trusted only when at least one of its
                  # attempts has a ledger in the artifact: the run step refuses
                  # a completion without one, and a manifest that claims it
                  # anyway must not be resumed as done.
                  prior_attempts = entry.get("attempts") or []
                  has_ledger = any(
                      isinstance(record, dict)
                      and isinstance(record.get("ledger_name"), str)
                      and record.get("ledger_name") in by_original
                      for record in prior_attempts
                  )
                  if not has_ledger:
                      refuse(
                          "run " + run_id + " marks " + str(case_id)
                          + " COMPLETED but no attempt has a ledger"
                      )
                  (CASES_DIR / (case_id + ".json")).write_bytes(payload)
                  completed[case_id] = {"result_sha256": digest, "source_run_id": run_id}

          # An attempt that reached live-run but left no readable ledger has
          # unknown spend. Re-running it could spend twice, so a resume refuses
          # until an owner intervenes.
          for case_id, attempts in merged.items():
              for attempt, payload in attempts.items():
                  if (
                      isinstance(payload, dict)
                      and payload.get("status") == "LEDGER_INVALID"
                      and payload.get("spent_cents") is None
                  ):
                      refuse(
                          "case " + str(case_id) + " attempt " + str(attempt)
                          + " reached live-run with no readable ledger; spend is "
                          "unknown and the dispatch is not resumable"
                      )
          prior_attempts = 0
          for case_id in plan["case_ids"]:
              attempts = merged[case_id]
              ordered = [attempts[key] for key in sorted(attempts)]
              entry = state["cases"][case_id]
              entry["attempts"] = ordered
              prior_attempts += len(ordered)
              if case_id in completed:
                  entry["status"] = "COMPLETED"
                  entry["result_sha256"] = completed[case_id]["result_sha256"]
                  entry["completed_in_run"] = completed[case_id]["source_run_id"]
              else:
                  if ordered:
                      entry["status"] = str(ordered[-1].get("status") or "PENDING")
                  if entry["status"] == "COMPLETED":
                      # An attempt record can say COMPLETED only when its result
                      # was actually copied; otherwise the case stays runnable.
                      entry["status"] = "CONFIG_CHANGED"
              if entry["status"] == "IN_FLIGHT":
                  # A killed attempt leaves IN_FLIGHT behind; it is not a claim
                  # that the case is still running, so the resume marks it.
                  entry["status"] = "ABANDONED_ON_RESUME"
          # The spend baseline is the set of copied ledgers itself, each counted once,
          # so it cannot drift from the run step's total_spent().
          prior_spend = 0
          for ledger in sorted(LEDGER_DIR.glob("*.json")):
              prior_spend += ledger_spend(ledger)
          # Evidence-preserving reconciliation gate (owner 2026-10-30): a prior
          # ledger with unreconciled cost entries blocks a new paid dispatch
          # until a committed, owner-attested reconciliation record covers it.
          # The ledger bytes, the attempt history and the cumulative ceiling are
          # never modified; the recorded charge stays counted exactly once. The
          # check runs BEFORE the run step maps a provider key, so an
          # unreconciled point cannot be retried at cost. A missing record, a
          # PENDING record, a ledger mismatch, a repriced entry, an uncovered
          # entry, a duplicate claim or a budget mismatch all refuse.
          try:
              reconciliation_records = load_records(
                  WORKSPACE / "tools" / "behavioral_eval_runner" / "live" / "reconciliation"
              )
          except LedgerReconciliationRefusedError as exc:
              refuse("the committed reconciliation records are invalid: " + exc.reason_code)
          reconciled_ledgers = []
          for ledger_path in sorted(LEDGER_DIR.glob("*.json")):
              try:
                  payload = json.loads(ledger_path.read_text(encoding="utf-8"))
                  raw = ledger_path.read_bytes()
              except (OSError, ValueError):
                  refuse("ledger " + ledger_path.name + " is unreadable during reconciliation")
              unreconciled = payload.get("unreconciled_count")
              if type(unreconciled) is not int or unreconciled < 0:
                  refuse("ledger " + ledger_path.name + " has no non-negative integer unreconciled_count")
              if unreconciled == 0:
                  continue
              record = reconciliation_records.get(hashlib.sha256(raw).hexdigest())
              if record is None:
                  refuse(
                      "ledger " + ledger_path.name + " has " + str(unreconciled)
                      + " unreconciled cost entry(ies) and no committed"
                      " owner-attested reconciliation record; no paid retry is"
                      " authorized until the ledger point is reconciled"
                  )
              try:
                  view = reconcile_ledger(payload, record, ledger_bytes=raw)
              except LedgerReconciliationRefusedError as exc:
                  refuse(
                      "ledger " + ledger_path.name + " reconciliation refused: "
                      + exc.reason_code
                  )
              reconciled_ledgers.append({
                  "ledger_name": ledger_path.name,
                  **view,
              })
          if legacy_smoke_manifests:
              refuse(
                  "prior resume manifest(s) without smoke-spend records: "
                  + ", ".join(legacy_smoke_manifests)
                  + "; smoke spend history cannot be proven (no silent zero)"
              )
          # Standalone historical eval-smoke proofs are part of the same
          # allowance; a successful smoke run without a readable proof is
          # UNKNOWN and refuses rather than counting as zero.
          try:
              standalone_smoke = collect_smoke_proof_spends(
                  gh=lambda args: gh(*args),
                  repository=repository,
                  work_dir=RUNNER_TEMP / "ber-standalone-smoke-history",
                  current_run_id=current_run,
              )
          except ValueError as exc:
              refuse("standalone smoke history is not restorable: " + str(exc))
          if standalone_smoke:
              prior_smoke_manifests.append(standalone_smoke)
          try:
              incoming_state = collect_latest_allowance_state(
                  gh=lambda args: gh(*args),
                  repository=repository,
                  work_dir=RUNNER_TEMP / "ber-allowance-state",
                  current_run_id=current_run,
              )
          except ValueError as exc:
              refuse("shared allowance state is not restorable: " + str(exc))
          incoming_outstanding = 0 if incoming_state is None else incoming_state["outstanding_reservations_cents"]
          state["incoming_outstanding_reservations_cents"] = incoming_outstanding
          try:
              prior_smoke_spends = restore_smoke_spend(prior_smoke_manifests)
          except ValueError as exc:
              refuse("prior smoke history is not restorable: " + str(exc))
          current_smoke = plan.get("smoke_gate")
          if not isinstance(current_smoke, dict) or not current_smoke:
              # F-A-5: a live trial plan must carry the same-head smoke gate.
              refuse("the live dispatch plan has no same-head smoke gate record")
          try:
              smoke_records = merge_smoke_gate_spend(prior_smoke_spends, current_smoke)
          except ValueError as exc:
              refuse("the current smoke-gate spend record is invalid: " + str(exc))
          state["smoke_spend"] = smoke_records
          state["smoke_spend_cents"] = smoke_spend_total(smoke_records)
          state["smoke_history"] = {
              "schema": "ber-smoke-spend/1.0.0",
              "current_gate_run_id": normalize_smoke_run_id(current_smoke.get("smoke_run_id")),
              "prior_manifest_records": dict(prior_smoke_spends),
              "legacy_manifests_without_smoke": legacy_smoke_manifests,
              "standalone_smoke_runs_counted": sorted(smoke_records),
          }
          state["restored_from"] = (
              {
                  "runs": source_runs,
                  "runs_without_artifact": without_artifact,
                  "completed_cases": sorted(completed),
                  "completed_case_sources": [
                      {"case_id": case_id, "run_id": completed[case_id]["source_run_id"]}
                      for case_id in sorted(completed)
                  ],
                  "prior_attempts": prior_attempts,
                  "prior_spend_cents": prior_spend,
                  "smoke_spend_cents": smoke_spend_total(smoke_records),
                  "prior_smoke_spend_cents": smoke_spend_total(prior_smoke_spends),
                  "reconciled_ledgers": reconciled_ledgers,
                  "restored_at": utc_now(),
              }
              if source_runs
              else None
          )
          state["resume_refusal"] = skipped or None
          (MANIFEST_DIR / "manifest.json").write_text(
              json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          outcome = {
              "resume": "restored" if source_runs else "none",
              "run_attempt": run_attempt,
              "runs_listed": len(ordered_runs),
              "runs_listed_total": declared_total,
              "runs_without_artifact": without_artifact,
              "source_run_ids": source_runs,
              "completed_cases": sorted(completed),
              "prior_attempts": prior_attempts,
              "prior_spend_cents": prior_spend,
              "reconciled_ledgers": reconciled_ledgers,
              "skipped_manifests": skipped,
              "reason": (
                  None if source_runs
                  else "no prior resume manifest matched this frozen dataset"
              ),
          }
          print(json.dumps(outcome, indent=2, sort_keys=True))
          PY
      - name: Run the remaining cases as resumable per-case chunks
        # Never runs in a preflight-only dispatch (that mode maps no key and
        # makes no provider call), and never after a failed restore: running
        # with no prior state would re-dispatch completed cases and forget
        # their spend.
        if: ${{ inputs.preflight_only != true && steps.restore.outcome == 'success' }}
        # Stops below the 360-minute job timeout so the always() steps that
        # persist and publish the manifest still run when this step times out.
        timeout-minutes: 330
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -P - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          WORKSPACE = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          RUNNER_TEMP = Path(os.environ["RUNNER_TEMP"]).resolve()
          MANIFEST_DIR = RUNNER_TEMP / "ber-manifest"
          CASES_DIR = MANIFEST_DIR / "cases"
          LEDGER_DIR = MANIFEST_DIR / "ledgers"
          GATE_DIR = RUNNER_TEMP / "ber-gates"
          EVIDENCE_DIR = RUNNER_TEMP / "ber-evidence"
          CHUNK_ROOT = WORKSPACE / ".ber-run" / "chunks"
          MANIFEST_PATH = MANIFEST_DIR / "manifest.json"
          # The chunk root is generated inside the checkout. Refuse a symlinked
          # .ber-run in the dispatched ref, and prove after creation that the
          # resolved root is still inside the workspace, so a tracked symlink
          # cannot redirect the writes.
          if (WORKSPACE / ".ber-run").is_symlink() or CHUNK_ROOT.is_symlink():
              print("REFUSED: .ber-run or .ber-run/chunks is a symlink", flush=True)
              raise SystemExit(1)
          for directory in (CASES_DIR, LEDGER_DIR, GATE_DIR, EVIDENCE_DIR, CHUNK_ROOT):
              directory.mkdir(parents=True, exist_ok=True)
          try:
              CHUNK_ROOT.resolve().relative_to(WORKSPACE)
          except ValueError:
              print("REFUSED: the chunk root is outside the workspace", flush=True)
              raise SystemExit(1)

          sys.path.insert(0, str(WORKSPACE))
          from tools.behavioral_eval_runner.live.config import LiveConfig  # noqa: E402
          from tools.behavioral_eval_runner.live.cumulative import (  # noqa: E402
              smoke_spend_total,
          )
          from tools.behavioral_eval_runner.live.dataset import (  # noqa: E402
              dataset_digest,
              load_cases,
          )
          from tools.behavioral_eval_runner.live.gate import OwnerGateRecord  # noqa: E402

          plan = json.loads((RUNNER_TEMP / "ber-plan.json").read_text(encoding="utf-8"))
          state = json.loads(MANIFEST_PATH.read_text(encoding="utf-8"))
          CEILING = int(plan["spend_ceiling_cents"])
          COMMITTED_CASES = {
              case.case_id: case
              for case in load_cases(str(WORKSPACE / plan["dataset_path"]))
          }
          # Re-assert the frozen set in this step, not only in the config step:
          # a change between the steps must stop the run before any chunk is
          # built from bytes the gate did not freeze.
          if len(COMMITTED_CASES) != plan["case_count"]:
              print("REFUSED: the committed case count changed during the run", flush=True)
              raise SystemExit(1)
          if dataset_digest(list(COMMITTED_CASES.values())) != plan["dataset_sha256"]:
              print("REFUSED: the committed dataset digest changed during the run", flush=True)
              raise SystemExit(1)
          # One case per invocation: a timeout can therefore lose at most the
          # case in flight, and a completed case is never dispatched again.
          PER_CASE_TIMEOUT_SECONDS = 1500

          # The uploaded case record is a closed shape: these are the only
          # package fields the summary needs, and nothing else from live-run
          # stdout is written to the uploaded artifact.
          RESULT_KEYS = (
              "command",
              "status",
              "planned_calls",
              "dispatched_calls",
              "spent_cents",
              "ceiling_cents",
              "halt",
              "halt_reason_code",
              "results",
              "evidence",
              "network_calls",
              "raw_transcript_included",
              "cost_ledger",
          )
          RESULT_ITEM_KEYS = (
              "case_id",
              "skill",
              "arm",
              "run_index",
              "subject_vendor",
              "result_state",
              "reason_code",
              "citability",
              "rule_state_if_citable",
              "deterministic",
              "subject",
              "judge",
              "raw_transcript_included",
          )
          EVIDENCE_KEYS = (
              "verified",
              "final_report_sha256",
              "final_evidence_manifest_sha256",
          )


          def closed_result_item(item):
              out = {key: item.get(key) for key in RESULT_ITEM_KEYS if key in item}
              deterministic = out.get("deterministic")
              if isinstance(deterministic, dict):
                  out["deterministic"] = {
                      key: deterministic.get(key)
                      for key in ("status", "checks", "failures")
                  }
              subject = out.get("subject")
              if isinstance(subject, dict):
                  out["subject"] = {
                      key: subject.get(key)
                      for key in ("served_model", "pinned_match")
                  }
              judge = out.get("judge")
              if isinstance(judge, dict):
                  verdict = judge.get("verdict")
                  out["judge"] = {
                      "verdict": (
                          {
                              key: verdict.get(key)
                              for key in ("verdict", "reason_code", "failure_mode")
                          }
                          if isinstance(verdict, dict)
                          else None
                      ),
                      "judge_error_kind": judge.get("judge_error_kind"),
                  }
              return out


          def utc_now():
              return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


          def write_state():
              # Every persisted record carries the refusal reasons, including a
              # record written just before a fail-fast SystemExit.
              state["failures"] = list(failures)
              # Atomic replace; a concurrent reader must never make the
              # persisted record fail (Windows can deny a rename while the
              # destination is open, Linux never does).
              temporary = MANIFEST_PATH.with_suffix(".json.tmp")
              temporary.write_text(
                  json.dumps(state, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              for _ in range(50):
                  try:
                      os.replace(temporary, MANIFEST_PATH)
                      return
                  except OSError:
                      time.sleep(0.02)
              os.replace(temporary, MANIFEST_PATH)


          def ledger_spent(path):
              """The charge the package recorded, or None when no ledger exists.

              The package snapshots its ledger after every accounted call, so
              a killed or timed-out attempt still leaves the charges it made.
              A ledger that exists but cannot be read, is not an object, or does
              not carry a non-negative integer charge is a refusal: a malformed
              ledger must never be counted as zero.
              """
              if not path.exists():
                  return None
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  print(f"REFUSED: ledger {path.name} is unreadable", flush=True)
                  raise SystemExit(1)
              if not isinstance(payload, dict):
                  print(f"REFUSED: ledger {path.name} is not a JSON object", flush=True)
                  raise SystemExit(1)
              spent = payload.get("spent_cents")
              if type(spent) is not int or spent < 0:
                  print(
                      f"REFUSED: ledger {path.name} has no non-negative "
                      "integer spent_cents",
                      flush=True,
                  )
                  raise SystemExit(1)
              return spent


          def ledger_charges():
              observed = {}
              for path in sorted(LEDGER_DIR.glob("*.json")):
                  spent = ledger_spent(path)
                  if spent is not None:
                      observed[path.name] = spent
              return observed


          def smoke_spent():
              """The cumulative smoke spend, exactly once per smoke run id."""
              try:
                  return smoke_spend_total(state.get("smoke_spend"))
              except ValueError as exc:
                  print("REFUSED: invalid recorded smoke spend: " + str(exc), flush=True)
                  raise SystemExit(1)


          def total_spent():
              """Cumulative spend over every dispatch, counted exactly once.

              Ledgers are the spend record that survives a timeout, and every
              prior dispatch's ledger is copied in beside the new ones, so each
              ledger is counted once by name. A manifest record's spent_cents
              is used only for an attempt that has no ledger, so an attempt is
              never charged twice and a HALTED or timed-out charge is never
              lost. A ledger no record names (a killed attempt from an older
              manifest) is still counted.
              """
              observed = ledger_charges()
              total = 0
              attributed = set()
              for case_id, entry in state["cases"].items():
                  for record in entry.get("attempts", []):
                      if not isinstance(record, dict):
                          continue
                      name = record.get("ledger_name")
                      if isinstance(name, str) and name in observed:
                          # Count each ledger exactly once: a record naming an
                          # already attributed ledger adds nothing.
                          if name not in attributed:
                              total += observed[name]
                              attributed.add(name)
                          continue
                      spent = record.get("spent_cents")
                      if type(spent) is int:
                          if spent < 0:
                              print(
                                  f"REFUSED: an attempt records a negative {spent}c",
                                  flush=True,
                              )
                              raise SystemExit(1)
                          if spent > 0:
                              print(
                                  f"REFUSED: an attempt records {spent}c with no ledger",
                                  flush=True,
                              )
                              raise SystemExit(1)
                          total += spent
              for name, spent in observed.items():
                  if name not in attributed:
                      total += spent
              return total + smoke_spent()


          def attempt_floor(case_id, entry):
              """One past the highest attempt number any dispatch used."""
              highest = 0
              for record in entry.get("attempts", []):
                  attempt = record.get("attempt") if isinstance(record, dict) else None
                  if type(attempt) is int and attempt > highest:
                      highest = attempt
              for name in ledger_charges():
                  stem = name[:-5] if name.endswith(".json") else name
                  marker = stem.rfind("-attempt")
                  if marker < 0:
                      continue
                  tail = stem[marker + len("-attempt"):]
                  if not tail.isdigit():
                      continue
                  owner = stem[:marker]
                  if owner == case_id or owner.endswith("-" + case_id):
                      highest = max(highest, int(tail))
              return highest + 1


          def halt_view_of(halt):
              """Publish closed, typed fields only: no free-form detail."""
              if not isinstance(halt, dict):
                  return None
              view = {
                  key: halt.get(key)
                  for key in (
                      "halted",
                      "reason_code",
                      "spent_cents",
                      "ceiling_cents",
                      "calls_dispatched",
                      "requested_cents",
                  )
              }
              view["vendor"] = halt.get("vendor")
              view["model"] = halt.get("model")
              return view


          def enforce_ceiling():
              """Fail closed before any further reservation can be made."""
              spent = total_spent()
              if spent > CEILING:
                  failures.append(
                      f"cumulative spend {spent}c across dispatches exceeds the "
                      f"{CEILING}c ceiling"
                  )
                  state["ceiling_breach"] = {
                      "spent_cents": spent,
                      "ceiling_cents": CEILING,
                  }
                  write_state()
                  raise SystemExit(1)
              return spent


          def run_cli(args, timeout, secret_free=False):
              environment = dict(os.environ)
              environment["PYTHONPATH"] = str(WORKSPACE)
              if secret_free:
                  # The offline preflight never needs a provider key: scrub it so
                  # a key cannot reach that subprocess even by inheritance.
                  for name in ("ANTHROPIC_API_KEY", "OPENAI_API_KEY"):
                      environment.pop(name, None)
              return subprocess.run(
                  [sys.executable, "-P", "-m", "tools.behavioral_eval_runner", *args],
                  capture_output=True,
                  text=True,
                  timeout=timeout,
                  cwd=str(WORKSPACE),
                  env=environment,
              )


          failures = []
          skipped_cases = []
          ran_cases = []
          for case_id in plan["case_ids"]:
              entry = state["cases"].get(case_id)
              if entry is None:
                  entry = {"case_id": case_id, "status": "PENDING", "attempts": []}
                  state["cases"][case_id] = entry
              if entry.get("status") == "COMPLETED":
                  completed_result = CASES_DIR / (case_id + ".json")
                  try:
                      completed_digest = hashlib.sha256(
                          completed_result.read_bytes()
                      ).hexdigest()
                  except OSError:
                      completed_digest = None
                  if completed_digest == entry.get("result_sha256"):
                      skipped_cases.append(case_id)
                      print(f"SKIP {case_id}: completed by an earlier dispatch")
                      continue
                  # A COMPLETED status without its recorded result is not
                  # complete; run it rather than skipping a case the summary
                  # could not verify.
                  entry["status"] = "PENDING"
              # Cumulative first: the budget still unspent is what every
              # prior dispatch already charged, not just this manifest's.
              enforce_ceiling()
              remaining = CEILING - total_spent()
              if remaining <= 0:
                  entry["status"] = "NOT_RUN_BUDGET"
                  failures.append(
                      f"{case_id}: the {CEILING}c ceiling is exhausted before dispatch"
                  )
                  write_state()
                  break
              # One past every attempt any dispatch used for this case, so a
              # copied prior ledger is never overwritten and the package never
              # refuses an existing ledger path.
              attempt = attempt_floor(case_id, entry)
              ledger_name = f"{case_id}-attempt{attempt}.json"
              while (LEDGER_DIR / ledger_name).exists():
                  attempt += 1
                  ledger_name = f"{case_id}-attempt{attempt}.json"
              record = {
                  "attempt": attempt,
                  "ledger_name": ledger_name,
                  "started_at": utc_now(),
                  "status": "IN_FLIGHT",
                  "spent_cents": None,
              }
              entry.setdefault("attempts", []).append(record)
              entry["status"] = "IN_FLIGHT"
              write_state()

              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", case_id):
                  failures.append(f"{case_id}: the case id is not a safe path component")
                  entry["status"] = "CHUNK_INVALID"
                  write_state()
                  break
              source_case = COMMITTED_CASES[case_id]
              source_path = WORKSPACE / plan["dataset_path"] / case_id / "case.json"
              # load_cases reads immediate child directories that hold a
              # case.json, so one case is one child directory under its own
              # chunk root: .ber-run/chunks/<case>/<case>/case.json
              chunk_root = CHUNK_ROOT / case_id
              chunk_case_dir = chunk_root / case_id
              if chunk_root.is_symlink() or chunk_case_dir.is_symlink():
                  failures.append(f"{case_id}: the chunk path is a symlink")
                  entry["status"] = "CHUNK_INVALID"
                  write_state()
                  break
              if chunk_root.exists():
                  shutil.rmtree(chunk_root)
              chunk_case_dir.mkdir(parents=True, exist_ok=True)
              try:
                  chunk_case_dir.resolve().relative_to(WORKSPACE)
              except ValueError:
                  failures.append(f"{case_id}: the chunk case path is outside the workspace")
                  entry["status"] = "CHUNK_INVALID"
                  write_state()
                  break
              shutil.copyfile(source_path, chunk_case_dir / "case.json")
              chunk_cases = load_cases(str(chunk_root))
              if len(chunk_cases) != 1 or chunk_cases[0].case_id != case_id:
                  failures.append(f"{case_id}: the chunk did not load exactly one case")
                  entry["status"] = "CHUNK_INVALID"
                  write_state()
                  break
              if chunk_cases[0].record_sha256 != source_case.record_sha256:
                  failures.append(f"{case_id}: the chunk bytes differ from the committed case")
                  entry["status"] = "CHUNK_INVALID"
                  write_state()
                  break
              chunk_digest = dataset_digest(chunk_cases)

              staged = json.loads(
                  (RUNNER_TEMP / "live-gate.json").read_text(encoding="utf-8")
              )
              staged["dataset"] = {
                  "revision": plan["dispatch_sha"],
                  "path": f".ber-run/chunks/{case_id}",
                  "sha256": chunk_digest,
                  "case_count": 1,
              }
              chunk_gate = OwnerGateRecord.from_dict(staged)
              gate_path = GATE_DIR / f"{case_id}.json"
              gate_path.write_text(
                  json.dumps(staged, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              record["chunk_dataset_sha256"] = chunk_digest
              record["chunk_gate_sha256"] = hashlib.sha256(
                  gate_path.read_bytes()
              ).hexdigest()
              record["chunk_gate_digest"] = chunk_gate.digest()

              config = json.loads(
                  (RUNNER_TEMP / "live-config.json").read_text(encoding="utf-8")
              )
              config["spend_ceiling_cents"] = remaining
              LiveConfig.from_dict(config).validate()
              config_path = GATE_DIR / f"{case_id}-attempt{attempt}-config.json"
              config_path.write_text(
                  json.dumps(config, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              evidence_root = EVIDENCE_DIR / f"{case_id}-attempt{attempt}"
              ledger_path = LEDGER_DIR / ledger_name
              run_id = f"ber-{plan['run_id']}-{case_id}-a{attempt}"
              record["remaining_ceiling_cents"] = remaining
              write_state()

              try:
                  preflight = run_cli(
                      [
                          "live-preflight",
                          "--config", str(config_path),
                          "--gate", str(gate_path),
                          "--cases", str(chunk_root),
                          "--repo-root", str(WORKSPACE),
                          "--expected-revision", plan["dispatch_sha"],
                      ],
                      timeout=120,
                      secret_free=True,
                  )
              except subprocess.TimeoutExpired:
                  failures.append(f"{case_id}: the chunk preflight timed out")
                  record["status"] = "PREFLIGHT_TIMEOUT"
                  entry["status"] = "PREFLIGHT_TIMEOUT"
                  write_state()
                  enforce_ceiling()
                  break
              if preflight.returncode != 0:
                  failures.append(f"{case_id}: chunk preflight failed")
                  record["status"] = "PREFLIGHT_FAILED"
                  entry["status"] = "PREFLIGHT_FAILED"
                  write_state()
                  enforce_ceiling()
                  break
              try:
                  report = json.loads(preflight.stdout)
              except ValueError:
                  report = {}
              if report.get("status") not in {"READY", "READY_NEEDS_KEYS"} or report.get(
                  "blockers"
              ):
                  failures.append(f"{case_id}: chunk preflight reported blockers")
                  record["status"] = "PREFLIGHT_REFUSED"
                  record["preflight_status"] = report.get("status")
                  entry["status"] = "PREFLIGHT_REFUSED"
                  write_state()
                  enforce_ceiling()
                  break

              try:
                  completed = run_cli(
                      [
                          "live-run",
                          "--config", str(config_path),
                          "--gate", str(gate_path),
                          "--cases", str(chunk_root),
                          "--repo-root", str(WORKSPACE),
                          "--evidence-root", str(evidence_root),
                          "--cost-ledger", str(ledger_path),
                          "--run-id", run_id,
                      ],
                      timeout=PER_CASE_TIMEOUT_SECONDS,
                  )
              except subprocess.TimeoutExpired:
                  failures.append(
                      f"{case_id}: the per-case invocation exceeded "
                      f"{PER_CASE_TIMEOUT_SECONDS}s and was killed"
                  )
                  record["status"] = "ATTEMPT_TIMEOUT"
                  record["finished_at"] = utc_now()
                  # The killed package still snapshotted what it charged, so
                  # a timed-out attempt's spend is read from its ledger
                  # instead of being recorded as None and forgotten.
                  record["spent_cents"] = ledger_spent(ledger_path)
                  entry["status"] = "ATTEMPT_TIMEOUT"
                  write_state()
                  enforce_ceiling()
                  break
              result_path = CASES_DIR / (case_id + ".json")


              def withhold_result():
                  # An untrustworthy COMPLETED claim must not leave a result
                  # file that says COMPLETED while the run record says otherwise.
                  if result_path.exists():
                      result_path.unlink()
                  record["result_sha256"] = None


              try:
                  result = json.loads(completed.stdout)
              except ValueError:
                  result = None
              if not isinstance(result, dict):
                  # Never upload the raw stdout of an unparseable result: a closed
                  # marker is written instead, so the resume artifact carries no
                  # free-form package output.
                  result_path.write_text(
                      json.dumps(
                          {
                              "command": "live-run",
                              "status": "RESULT_INVALID",
                              "raw_stdout_withheld": True,
                          },
                          indent=2,
                          sort_keys=True,
                      )
                      + "\n",
                      encoding="utf-8",
                  )
                  failures.append(f"{case_id}: live-run produced no parseable result")
                  record["result_sha256"] = hashlib.sha256(
                      result_path.read_bytes()
                  ).hexdigest()
                  record["status"] = "RESULT_INVALID"
                  record["spent_cents"] = ledger_spent(ledger_path)
                  entry["status"] = "RESULT_INVALID"
                  write_state()
                  enforce_ceiling()
                  break
              result_error_present = bool(result.get("error"))
              # The resume artifact is uploaded, so only the allowlisted fields
              # are written: free-form error text and every unlisted package
              # field are dropped, nested records are reduced to the fields the
              # summary reads, and a halt is stored as its closed allowlist view.
              sanitized = {
                  key: result.get(key) for key in RESULT_KEYS if key in result
              }
              items = sanitized.get("results")
              if isinstance(items, list):
                  sanitized["results"] = [
                      closed_result_item(item)
                      for item in items
                      if isinstance(item, dict)
                  ]
              evidence_view = sanitized.get("evidence")
              if isinstance(evidence_view, dict):
                  sanitized["evidence"] = {
                      key: evidence_view.get(key) for key in EVIDENCE_KEYS
                  }
              if isinstance(sanitized.get("halt"), dict):
                  sanitized["halt"] = halt_view_of(sanitized["halt"])
              result = sanitized
              result_path.write_text(
                  json.dumps(result, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              record["result_sha256"] = hashlib.sha256(
                  result_path.read_bytes()
              ).hexdigest()
              record["spent_cents"] = ledger_spent(ledger_path)
              record["dispatched_calls"] = result.get("dispatched_calls")
              record["finished_at"] = utc_now()
              if completed.returncode != 0 and result.get("status") == "COMPLETED":
                  # A non-zero return code never sets a case COMPLETED, whatever
                  # the JSON on stdout claims. A legitimate halt (the package
                  # exits 3 with status HALTED) is handled by the halt branch
                  # below, not relabelled as an error.
                  record["status"] = "ERROR"
                  record["returncode"] = completed.returncode
                  record["halt_view"] = halt_view_of(result.get("halt"))
                  record["halt_reason_code"] = result.get("halt_reason_code")
                  record["error_present"] = result_error_present
                  entry["status"] = "ERROR"
                  withhold_result()
                  failures.append(
                      f"{case_id}: live-run exited with return code "
                      f"{completed.returncode}"
                  )
                  write_state()
                  enforce_ceiling()
                  break
              record["status"] = result.get("status")
              if result.get("status") != "COMPLETED":
                  # The manifest is itself an uploaded artifact, so a halt is
                  # published through the same closed allowlist as the
                  # structured summary, never as the package's raw object.
                  record["halt_view"] = halt_view_of(result.get("halt"))
                  record["halt_reason_code"] = result.get("halt_reason_code")
                  record["error_present"] = result_error_present
                  entry["status"] = str(result.get("status") or "ERROR")
                  failures.append(
                      f"{case_id}: live-run finished with status "
                      f"{result.get('status')!r}"
                  )
                  write_state()
                  enforce_ceiling()
                  break
              if record["spent_cents"] is None:
                  # The package writes its ledger before it returns a result, so
                  # a COMPLETED result with no readable ledger cannot be counted.
                  # It is refused rather than trusted from stdout, because a case
                  # marked COMPLETED here would be skipped by every later dispatch.
                  failures.append(
                      f"{case_id}: completed live-run has no readable cost ledger"
                  )
                  record["status"] = "LEDGER_INVALID"
                  entry["status"] = "LEDGER_INVALID"
                  withhold_result()
                  write_state()
                  raise SystemExit(1)
              evidence = result.get("evidence")
              evidence = evidence if isinstance(evidence, dict) else {}
              if evidence.get("verified") is not True:
                  # A COMPLETED case must satisfy the same evidence invariant the
                  # summary checks; otherwise the manifest would permanently mark
                  # an unverifiable case as done and a later dispatch could not
                  # repair it.
                  failures.append(
                      f"{case_id}: live-run returned COMPLETED without verified evidence"
                  )
                  record["status"] = "EVIDENCE_UNVERIFIED"
                  entry["status"] = "EVIDENCE_UNVERIFIED"
                  withhold_result()
                  write_state()
                  enforce_ceiling()
                  break
              results = result.get("results")
              planned = plan.get("planned_calls_per_case")
              expected_results = (
                  planned // 2 if type(planned) is int and planned % 2 == 0 else None
              )
              if not isinstance(results, list) or (
                  expected_results is not None and len(results) != expected_results
              ):
                  failures.append(
                      f"{case_id}: live-run returned "
                      f"{len(results) if isinstance(results, list) else 'no'} "
                      f"results, expected {expected_results}"
                  )
                  record["status"] = "RESULT_COUNT_INVALID"
                  entry["status"] = "RESULT_COUNT_INVALID"
                  withhold_result()
                  write_state()
                  enforce_ceiling()
                  break
              entry["status"] = "COMPLETED"
              entry["result_sha256"] = record["result_sha256"]
              ran_cases.append(case_id)
              write_state()
              enforce_ceiling()
              print(
                f"DONE {case_id}: attempt {attempt}, spent "
                f"{record['spent_cents']}c, total {total_spent()}c"
              )

          # A case the run never reached is recorded UNRUN, not left PENDING:
          # the run record is what a later dispatch and the summary read.
          for case_id in plan["case_ids"]:
              pending = state["cases"].get(case_id)
              if isinstance(pending, dict) and pending.get("status") == "PENDING":
                  pending["status"] = "UNRUN"
          missing = [
              case_id
              for case_id in plan["case_ids"]
              if (state["cases"].get(case_id) or {}).get("status") != "COMPLETED"
          ]
          state["updated_at"] = utc_now()
          state["last_dispatch"] = {
              "run_id": plan.get("run_id"),
              "run_attempt": plan.get("run_attempt"),
              "skipped_as_complete": skipped_cases,
              "ran_in_this_dispatch": ran_cases,
          }
          # Every refusal reason is part of the run record, so a later reader
          # does not have to scrape the step log to learn why a case stopped.
          state["failures"] = list(failures)
          cumulative = total_spent()
          if cumulative > CEILING:
              failures.append(
                  f"cumulative spend {cumulative}c across dispatches exceeds the "
                  f"{CEILING}c ceiling"
              )
              state["ceiling_breach"] = {
                  "spent_cents": cumulative,
                  "ceiling_cents": CEILING,
              }
          state["totals"] = {
              "cases_completed": len(plan["case_ids"]) - len(missing),
              "cases_missing": len(missing),
              "spent_cents": cumulative,
              "smoke_spend_cents": smoke_spent(),
              "ceiling_cents": CEILING,
              "prior_spend_cents": (state.get("restored_from") or {}).get(
                  "prior_spend_cents"
              ),
          }
          write_state()
          print(
              json.dumps(
                  {
                      "cases_completed": state["totals"]["cases_completed"],
                      "cases_missing": missing,
                      "spent_cents": state["totals"]["spent_cents"],
                      "ceiling_cents": CEILING,
                      "prior_spend_cents": state["totals"]["prior_spend_cents"],
                      "ceiling_breach": state.get("ceiling_breach"),
                      "failures": failures,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          if missing or failures:
              raise SystemExit(1)
          PY

      - name: Upload resume manifest (always; completed cases survive a timeout)
        # A preflight-only dispatch never runs a case, so it must not publish an
        # empty manifest that a later dispatch could mistake for the newest
        # resume state and re-dispatch completed cases.
        # A failed restore must not publish a partial (empty) manifest that a
        # later dispatch could mistake for this dataset's resume state.
        if: always() && inputs.preflight_only != true && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ber-resume-manifest
          path: ${{ runner.temp }}/ber-manifest/
          # 90 days covers the gate's 7-day validity and leaves a wide margin:
          # a 14-day artifact that expired would make the dataset unresumable.
          retention-days: 90
          # The manifest is the spend and resume record: a run that executed the
          # case step but produced no manifest must fail the workflow, never
          # publish an empty artifact that later dispatches would trust.
          if-no-files-found: error

      - name: Preflight-only stop ($0, no provider call, no key mapped)
        # Owner decision item 4: one preflight-only dispatch costs nothing. This
        # step is the only step a preflight_only dispatch runs after the
        # offline preflight, and it fails closed unless that preflight was
        # clean: READY or READY_NEEDS_KEYS, zero blockers, checkout revision ==
        # staged gate revision == dispatched commit, the frozen dataset, and
        # proof that this job held no model key and made no network call.
