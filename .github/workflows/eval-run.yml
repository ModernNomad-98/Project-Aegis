              if not states:
                  return "UNRUN"
              if "FAIL" in states:
                  return "FAIL"
              if "ERROR" in states or "JUDGE_ERROR" in states:
                  return "ERROR"
              if "UNRUN" in states:
                  return "UNRUN"
              if "MOCK" in states:
                  return "MOCK"
              if set(states) == {"PASS"}:
                  return "PASS"
              return "UNRUN"


