          entries = state.get("cases") or {}
          entries = entries if isinstance(entries, dict) else {}
          config = load_json(CONFIG_PATH)
          config = config if isinstance(config, dict) else {}
          effective_ceiling = plan.get("spend_ceiling_cents")
          ceiling_failures = []
          plan_failures = []
          if (
              type(effective_ceiling) is not int
              or not 0 < effective_ceiling <= HARD_CEILING_CENTS
          ):
              ceiling_failures.append(
                  "the run plan has no positive integer effective ceiling at or below $120"
              )
