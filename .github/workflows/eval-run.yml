              reconciliation_load_failure = (
                  "the committed reconciliation records are invalid: "
                  + exc.reason_code
              )
              ledger_failures.append(reconciliation_load_failure)

          case_ids = plan.get("case_ids") or []
          records = []
          per_case = []
          case_results = {}
          spent_total = 0
          completed = []
          halt_payload = None
          attributed = set()
          for case_id in case_ids:
              entry = entries.get(case_id) or {}
              entry = entry if isinstance(entry, dict) else {}
