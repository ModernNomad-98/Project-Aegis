          gate_provider_cap = plan.get("gate_spend_provider_cap_cents")
          if type(gate_ceiling) is not int or gate_ceiling <= 0:
              ceiling_failures.append("the run plan has no valid gate spend ceiling")
          elif type(gate_provider_cap) is not int or gate_provider_cap <= 0:
