                      "case_id": case_id,
                      "status": status,
                      "attempts": len(attempts),
                      "result_sha256": entry.get("result_sha256"),
                      "spent_cents": case_spend,
                      "results": len(case_records),
                      "ledger_names": [
                          attempt.get("ledger_name")
                          for attempt in attempts
                          if isinstance(attempt.get("ledger_name"), str)
                      ],
                      "chunk_gate_digests": [
                          attempt.get("chunk_gate_digest")
                          for attempt in attempts
                          if isinstance(attempt.get("chunk_gate_digest"), str)
                      ],
                      "failed_attempts": [
                          {
                              "attempt": attempt.get("attempt"),
                              "status": attempt.get("status"),
                              "returncode": attempt.get("returncode"),
                              "halt_reason_code": attempt.get("halt_reason_code"),
                              "halt_view": attempt.get("halt_view"),
                          }
                          for attempt in attempts
                          if attempt.get("status") not in (None, "COMPLETED")
                      ],
                  }
              )
          for name, payload in ledgers.items():
              if name in attributed:
                  continue
              spent = integer(payload.get("spent_cents"))
              if spent is not None:
                  spent_total += spent
              attributed.add(name)
          # Smoke spend is a separate workflow's charge but part of the SAME
          # cumulative allowance: it is added exactly once per smoke run id and
