# Merge gate for main: skill/contract/BER checks, DCO and self-protection guard.
#
# Job names `validate-skills` and `gate-guard` are registered as required status
# checks — keep them unique across all workflows in this repo and do not rename
# them without updating branch protection.
name: validate-skills

# Two events, deliberately asymmetric (decision D60):
#   pull_request  required validate-skills + gate-guard block normal merge.
#                 Windows is additional coverage, not a registered required check.
#   push to main  a detection LANE, not a gate — it runs after the merge has
#                 already happened, so it cannot block anything; it exists to
#                 catch a main that went red by a route no pull request saw
#                 (an admin merge past a red gate-guard, a direct push, or a
#                 clean merge of two individually-clean branches).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Import-path isolation. Every script run and every `python -m pip` call
# runs with -P, so the script's own directory (or, for -m, the checkout
# root) is not put first on sys.path and a module a pull request adds beside
# a gate script cannot shadow the standard library or PyYAML and rewrite the
# exit status. -P rather than -I: -I also implies -E, which would drop the
# PYTHONIOENCODING and PYTHONDONTWRITEBYTECODE settings below. The
# `-m tools.behavioral_eval_runner` and `-m unittest` commands need the
# checkout root on sys.path and cannot take -P; in the gate jobs, gate-guard
# protects every root-level importable name instead.
#
# Gate isolation. The two gate jobs run only code gate-guard protects (plus
# pinned actions and dependencies). Test code a pull request can change
# without tripping gate-guard runs in the separate tools-tests jobs below,
# which share no runner, environment file, PATH or checkout with the gates.
# A step in a gate job can write $GITHUB_ENV or $GITHUB_PATH, or rewrite a
# gate script before it runs, so unguarded code must never run there.
#
# Windows executable lookup. CreateProcess searches the working directory
# (the checkout root) before PATH, so a root git.exe or python.exe added by a
# pull request would run in place of the real tool when record-check.py
# starts a command. NoDefaultCurrentDirectoryInExePath turns that search off;
# gate-guard also protects root-level executables, scripts and DLLs.
env:
  NoDefaultCurrentDirectoryInExePath: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  AEGIS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the DCO step below can walk the pull request's
          # commit range. Cheap on a repository this size.
          fetch-depth: 0

      - name: Keep synthetic fixture storage outside the checkout
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Pinned to a minor (decision D60). `3.x` silently followed the
          # runner image to whatever CPython shipped next, so the interpreter
          # the gate runs on could change without a reviewed commit — the one
          # unpinned input left in a workflow that pins its actions to commit
          # SHAs and PyYAML to an exact version. `3.14` is what `3.x` already
          # resolved to on ubuntu-latest at the time of the pin (CPython
          # 3.14.6, run 29882666002), so this froze current behaviour rather
          # than changing it. Dependabot does NOT bump `python-version`; this
          # line moves only by a deliberate reviewed pull request, which is
          # the point of pinning it.
          python-version: '3.14'

      # PyYAML powers the spec-strict frontmatter parse (decision D50); the
      # validator fails closed without it. Pinned exactly in requirements.txt
      # (decision D55) so CI is reproducible and dependabot has a file to bump.
      - name: Install pinned offline-check dependencies
        run: python -P -m pip install --quiet -r requirements-ci.txt

      - name: Record resolved dependency versions
        run: python -P scripts/ci/record-check.py dependencies -- python -P -m pip freeze

      - name: Verify SDK coverage and record host capabilities
        run: python -P scripts/ci/record-check.py environment -- python -P scripts/ci/check-environment.py

      - name: Check CI evidence and protected-path handling
        run: python -P scripts/ci/record-check.py ci-tests -- python -P scripts/tests/test_offline_ci.py

      # Who validates the validator (decision D55). The gate's own hard checks
      # are exercised against good/bad fixtures BEFORE it is trusted to judge
      # the library, so a refactor cannot silently disarm one.
      - name: Run validator self-tests
        run: python -P scripts/ci/record-check.py validator-tests -- python -P scripts/tests/test_validator.py

      # The default bash shell runs with `-eo pipefail`, so a nonzero exit
      # from the validator fails this job.
      - name: Run skill validator
        run: python -P scripts/ci/record-check.py skills -- python -P scripts/validate-skills.py

      # Audit candidates remain advisory; these tests check the audit's behavior.
      - name: Run contract-audit self-tests
        run: python -P scripts/ci/record-check.py contract-audit-tests -- python -P scripts/tests/test_audit_skill_contracts.py

      - name: Run BER self-check
        run: python -P scripts/ci/record-check.py ber-self-check -- python -m tools.behavioral_eval_runner self-check

      - name: Run complete offline BER suite
        run: python -P scripts/ci/record-check.py ber -- python -m unittest discover -s tools/behavioral_eval_runner/tests -p 'test_*.py' -v

      - name: Run Scenario A acceptance in PowerShell Core
        run: python -P scripts/ci/record-check.py acceptance-core -- pwsh -NoProfile -File scripts/acceptance/Test-ScenarioAEvidence.ps1

      # DCO enforcement (decision D60). Lives INSIDE this already-required job
      # rather than in a job of its own, so the contract is enforced the moment
      # it merges — a new job name would be advisory until someone added it to
      # branch protection.
      #
      # Pull-request-only, for two reasons: a push to main is post-merge, so
      # there is nothing left to gate; and squash/rebase merges can lawfully
      # rewrite trailers on the way in, so the sign-off contract is asserted
      # against the pull request's OWN commits, at the only moment they are the
      # thing being merged.
      #
      # The range ends at the pull request's real head SHA, not at HEAD: on a
      # pull_request event HEAD is a synthetic merge commit GitHub authored,
      # which no contributor can sign. `--no-merges` inside the script covers
      # ordinary merges made within the branch.
      - name: Verify DCO sign-off on every commit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_REF" --quiet
          python -P scripts/check_dco.py --range "origin/${BASE_REF}..${HEAD_SHA}"

      - name: Retain offline-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: offline-checks-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aegis-ci/
          retention-days: 14
          if-no-files-found: warn

  windows-offline-checks:
    # Additional coverage; not registered in branch protection. Closeout still
    # requires this job to pass. Do not hide failures with continue-on-error.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # BER fixtures verify historical authorization commits on BOTH hosts.
          fetch-depth: 0

      - name: Keep synthetic fixture storage outside the checkout
        run: |
          $fixtureTemp = (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName
          @("TEMP=$fixtureTemp", "TMP=$fixtureTemp") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      # One native command per step preserves its exit status in PowerShell.
      - name: Install pinned offline-check dependencies
        run: python -P -m pip install --quiet -r requirements-ci.txt

      - name: Record resolved dependency versions
        run: python -P scripts/ci/record-check.py dependencies -- python -P -m pip freeze

      - name: Verify SDK coverage and record host capabilities
        run: python -P scripts/ci/record-check.py environment -- python -P scripts/ci/check-environment.py

      - name: Check CI evidence handling
        run: python -P scripts/ci/record-check.py ci-tests -- python -P scripts/tests/test_offline_ci.py

      - name: Run validator self-tests
        run: python -P scripts/ci/record-check.py validator-tests -- python -P scripts/tests/test_validator.py

      - name: Run skill validator
        run: python -P scripts/ci/record-check.py skills -- python -P scripts/validate-skills.py

      - name: Run contract-audit self-tests
        run: python -P scripts/ci/record-check.py contract-audit-tests -- python -P scripts/tests/test_audit_skill_contracts.py

      - name: Run BER self-check
        run: python -P scripts/ci/record-check.py ber-self-check -- python -m tools.behavioral_eval_runner self-check

      - name: Run complete offline BER suite
        run: python -P scripts/ci/record-check.py ber -- python -m unittest discover -s tools/behavioral_eval_runner/tests -p 'test_*.py' -v

      # Sequential calls in the same checkout; each harness launches its own
      # current host. Both editions are tested, with no shell fallback.
      - name: Run Scenario A acceptance in Windows PowerShell 5.1
        # A Python intermediate launched from pwsh inherits Core's PSModulePath,
        # which can hide Desktop's Get-FileHash. Start this recorder in Desktop.
        shell: powershell
        run: python -P scripts/ci/record-check.py acceptance-desktop -- powershell -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance/Test-ScenarioAEvidence.ps1

      - name: Run Scenario A acceptance in PowerShell Core
        run: python -P scripts/ci/record-check.py acceptance-core -- pwsh -NoProfile -File scripts/acceptance/Test-ScenarioAEvidence.ps1

      - name: Retain offline-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: offline-checks-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aegis-ci/
          retention-days: 14
          if-no-files-found: warn

  # Tools test suites, isolated from the gate jobs (owner decision,
  # 2026-09-28). These suites are pull-request-controlled code outside the
  # gate-guard set, so they run on their own runners: nothing they write to
  # $GITHUB_ENV, $GITHUB_PATH or the checkout can reach a gate. Read-only
  # token, no secrets, and no credentials persisted in the checkout. Whether
  # these jobs become required status checks is a branch-protection decision.
  tools-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Keep synthetic fixture storage outside the checkout
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install pinned offline bridge dependencies without scripts
        working-directory: tools/aegis_setup/host_bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run offline bridge callback tests
        run: python -P scripts/ci/record-check.py setup-bridge -- node --test tools/aegis_setup/host_bridge/bridge.test.ts

      # `-m unittest` needs the checkout root on sys.path to import
      # `tools.*`, so these runs cannot take -P.
      - name: Run setup routing-contract tests
        run: python -P scripts/ci/record-check.py setup-tests -- python -m unittest discover -s tools/aegis_setup/tests -p 'test_*.py' -v

      - name: Run delivery-control tests
        run: python -P scripts/ci/record-check.py delivery-control -- python -m unittest discover -s tools/aegis_delivery_control/tests -p 'test_*.py' -v

      - name: Retain tools-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tools-tests-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aegis-ci/
          retention-days: 14
          if-no-files-found: warn

  tools-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Keep synthetic fixture storage outside the checkout
        run: |
          $fixtureTemp = (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName
          @("TEMP=$fixtureTemp", "TMP=$fixtureTemp") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install pinned offline bridge dependencies without scripts
        working-directory: tools/aegis_setup/host_bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run offline bridge callback tests
        run: python -P scripts/ci/record-check.py setup-bridge -- node --test tools/aegis_setup/host_bridge/bridge.test.ts

      - name: Run setup routing-contract tests
        run: python -P scripts/ci/record-check.py setup-tests -- python -m unittest discover -s tools/aegis_setup/tests -p 'test_*.py' -v

      # Records the token user, default owner, elevation and temp-root owners
      # that the owner-private delivery-control fixtures depend on (#512).
      # Read-only; exits 0. `-m` needs the checkout root, so no -P.
      - name: Record Windows ownership diagnostic
        run: python -P scripts/ci/record-check.py delivery-control-diagnostic -- python -m tools.aegis_delivery_control.tests.windows_owner_diagnostic

      - name: Run delivery-control tests
        run: python -P scripts/ci/record-check.py delivery-control -- python -m unittest discover -s tools/aegis_delivery_control/tests -p 'test_*.py' -v

      - name: Retain tools-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tools-tests-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aegis-ci/
          retention-days: 14
          if-no-files-found: warn

  gate-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    # Pull-request-only (decision D60): this job diffs against the pull
    # request's base, and a push event has no base_ref to diff against — it
    # would fail on a missing ref rather than on a real finding.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the merge-base diff against the PR base is available.
          fetch-depth: 0

      # The protected set was widened at decision D60 from "the merge gate" to
      # "the merge gate and the surfaces that enforce it": review-authority
      # routing (CODEOWNERS), the DCO check, and the tests that are the only
      # thing proving either gate script still works. Enforcement surfaces and
      # merge-gate surfaces should coincide — a change able to disarm the gate
      # should not be able to merge itself, whichever file it lands in.
      - name: Fail if this PR modifies the merge gate or its enforcement surfaces
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --quiet
          # Keep old paths on renames and parse NUL records so unusual names
          # cannot bypass a prefix check through Git's display quoting.
          git diff --no-renames --name-only -z "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/aegis-changed-files"
          # All of scripts/ is protected: `python scripts/<gate>.py` puts
          # scripts/ first on sys.path, so a new sibling module there could
          # shadow an import. The checkout root is first on sys.path for the
          # -m commands, so any root-level module, extension, .pth file or
          # package __init__ (tools.py, yaml.py, unittest.py, sitecustomize.py,
          # conftest.py, yaml/__init__.py, ...) is protected too, as is any
          # root-level executable, script or DLL (git.exe, python.cmd,
          # version.dll, ...), which Windows could otherwise find in the working
          # directory. Matching is
          # case-insensitive because Windows and macOS checkouts fold case.
          # .claude/agents/ is protected because Claude Code honours `hooks`,
          # `mcpServers` and `permissionMode` in project agent files, so an
          # agent file can run commands or widen permissions (finding P2-3).
          # Claude Code loads every .claude/agents/ from the working directory
          # up to the repository root, so nested copies are protected too. An
          # entry named `.claude` or `.claude/agents` itself (a git symlink, for
          # example) could redirect that lookup, so it is protected as well.
          # Claude Code and Git configuration is protected too (follow-up to
          # P2-3): .claude/settings*.json can define hooks, credential helpers
          # and permissions; .mcp.json starts MCP server processes (without a
          # prompt in -p and SDK runs); .claude/commands/ carries skill-style
          # frontmatter the validator does not check; .claude/hooks/ holds
          # scripts those hooks call; .claude-plugin/ bundles hooks and MCP
          # servers; .gitattributes can hide diffs and change the bytes that
          # evidence hashes cover. Claude Code and Git both read nested
          # copies, so every depth is protected, and the commands, hooks and
          # plugin directory entries match with or without a trailing slash
          # so a symlink standing in for the directory is protected too.
          gate_pattern='^(\.github/workflows/|\.github/CODEOWNERS$|(.*/)?\.claude/((agents|commands|hooks)(/|$)|settings(\.local)?\.json$)|(.*/)?\.claude$|(.*/)?\.claude-plugin(/|$)|(.*/)?\.mcp\.json$|(.*/)?\.gitattributes$|scripts/|[^/]+\.(py|pyc|pyw|pyd|so|pth|exe|com|bat|cmd|ps1|dll)$|[^/]+/__init__\.[^/]+$|tools/behavioral_eval_runner/|requirements(-ci)?\.txt$)'
          shopt -s nocasematch
          gate_files=()
          echo "Files changed in this PR:"
          while IFS= read -r -d '' path; do
            printf '  %q\n' "$path"
            if [[ "$path" =~ $gate_pattern ]]; then
              gate_files+=("$path")
            fi
          done < "$RUNNER_TEMP/aegis-changed-files"
          if [ "${#gate_files[@]}" -gt 0 ]; then
            echo "Gate files touched:"
            printf '  %q\n' "${gate_files[@]}"
            echo "This PR modifies the merge gate or an enforcement surface and requires manual review and merge."
            exit 1
          fi
          echo "No merge-gate or enforcement-surface files modified."
