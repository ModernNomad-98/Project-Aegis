  - id: EVAL-002
    title: Eval case unjudgeable as written
    authority: "docs/skill-generation-standard.md §6 (objective assertions required); repo eval schemas (evals.json: expect.assertions; trigger-evals.json: expected_skill)"
    surfaces: [evals-json, trigger-evals-json]
    classification: mechanical
    severity: P2
    confidence: high
    detector:
      type: eval_case_shape
      check: judgeable
      evidence_evals: "evals.json case {match} has no expect.assertions — unjudgeable as written"
      evidence_trigger: "trigger-evals case {match} names no expected_skill — unjudgeable as written"
    positive_fixture: .claude/skills/thin-contract/evals/evals.json
    negative_fixture: .claude/skills/clean-skill/evals/evals.json
    aegis_families: [AEGIS-018]
    false_positive_limits: >-
      Field presence is not assertion quality; both schemas are repo
      conventions and drift with them.
    semantic_review_owner: skill-quality-reviewer

  - id: EVAL-003
    title: Approval/state-related skill with no refusal or boundary case
    authority: "docs/skill-generation-standard.md §6; skill-quality-reviewer (evals that test real boundaries vs hollow filler)"
    surfaces: [evals-json]
    classification: mechanical
    severity: P1
    confidence: medium
    detector:
      type: eval_case_shape
      check: boundary_for_risk
      risk_pattern: '(?i)approv|authoriz'
      state_pattern: '(?i)project-state|append-only|state file'
      refusal_pattern: '(?i)refus|halt|stop|declin|reject|never|no write|not write|forbid'
      evidence: "approval/state-related skill has no refusal or boundary eval case"
    positive_fixture: .claude/skills/generic-approval/evals/evals.json
    negative_fixture: .claude/skills/clean-skill/evals/evals.json
    aegis_families: [AEGIS-014, AEGIS-018]
    false_positive_limits: >-
      Risk classification is keyword-based; refusal keywords in an unrelated
      assertion satisfy the check spuriously.
    semantic_review_owner: skill-quality-reviewer

  - id: EVAL-004
    title: Trigger-eval neighbor name not machine-resolvable
    authority: "repo trigger-evals convention (expected_skill / should_not_trigger / overlaps_with name neighbors); eval-runner-designer (a runner must resolve names mechanically)"
    surfaces: [trigger-evals-json]
    classification: mechanical
    severity: P1
    confidence: high
    detector:
      type: eval_neighbor_resolution
      annotation_strip_pattern: '\s*\((?:sub)?agent\)\s*$'
      severity_annotated: P2
      evidence_stale: "trigger-evals references neighbor {match}, which is not a skill or agent on disk"
      evidence_annotated: "trigger-evals neighbor {match} is annotated prose, not a resolvable name (target {stripped} exists) — an eval runner cannot match it mechanically"
    positive_fixture: .claude/skills/thin-contract/evals/trigger-evals.json
    negative_fixture: .claude/skills/clean-skill/evals/trigger-evals.json
    aegis_families: [AEGIS-060, AEGIS-018]
    false_positive_limits: >-
      Only the "(subagent)"/"(agent)" annotation form is stripped; other
